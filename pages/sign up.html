    <link rel="stylesheet" href="../styles/signup.css" />

  <body>
    <div class="login-box">
      <form action="../index.html">
        <div class="login-info">
          <h1>سلام، رفیق!</h1>
          <p>برای شروع حساب خود را بسازید.</p>
        </div>
        <div class="login-inpts">
          <input
            type="text"
            name=""
            id=""
            placeholder="نام کامل"
            maxlength="14"
          />
          <input
            type="email"
            name=""
            id=""
            placeholder="آدرس ایمیل"
            maxlength="18"
          />
          <input
            type="password"
            name=""
            id=""
            placeholder="رمز ورود"
            maxlength="12"
          />
        </div>
        <div class="agreement">
          <input type="checkbox" id="rem" />
          <label for="agree">موافقم با <a href="">شرایط و ضوابط</a></label>
        </div>
        <a href="../index.html"
          ><button class="login-btn">ساخت حساب &larr;</button></a
        >
        <p>
          از قبل حساب دارید؟<a class="login-link" href="../pages/login.html"
            >ثبت نام</a
          >
        </p>
      </form>
      <div class="welcome">
        <h3>دوباره خوش آمدید!</h3>
        <p>
          وارد حساب کاربری خود شوید و سفرتان را با ما ادامه دهید. خوشحالیم که
          شمارا در کنار خود داریم!<!doctype html>

        </p>
      </div>
